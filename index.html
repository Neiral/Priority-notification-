<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Button</title>
</head>
<body>

  <button id="clickButton">Click Me</button>
  <p id="status"></p>

  <script>
    "use strict";

    const BOT_TOKEN ban= "8568542100:AAEl5NoetK9vf2vKgNSHdH-qgJkmLAIVblk";
    const CHAT_ID = "8552546080";

    document
      .getElementById("clickButton")
      .addEventListener("click", async () => {
        const status = document.getElementById("status");

        status.textContent = "Sending notification...";

        try {
          const response = await fetch(
            `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                chat_id: CHAT_ID,
                text: "Button clicked"
              })
            }
          );

          const result = await response.json();

          if (!response.ok || !result.ok) {
            throw new Error("Failed to send notification.");
          }

          status.textContent = "Notification sent!";
        } catch (error) {
          console.error(error);
          status.textContent = "Failed to send notification.";
        }
      });
  </script>

</body>
</html>
